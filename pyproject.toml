[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "faceswap-video"
version = "0.1.0"
description = "Swap a face from an image onto faces in a video (InsightFace inswapper)."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "insightface>=0.7.3",
    "onnxruntime>=1.16",
    "opencv-python>=4.8",
    "numpy>=1.24",
    "imageio-ffmpeg>=0.4.9",
]

[project.optional-dependencies]
ui = ["gradio>=4.0"]
test = ["pytest>=7"]

[project.scripts]
faceswap-video = "faceswap_video.cli:main"
faceswap-video-ui = "faceswap_video.webui:main"

[tool.setuptools]
packages = ["faceswap_video"]

[tool.pytest.ini_options]
testpaths = ["tests"]
